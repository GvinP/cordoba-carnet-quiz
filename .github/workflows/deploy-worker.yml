name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required secrets
        run: |
          missing=()
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && missing+=("TELEGRAM_BOT_TOKEN")
          [ -z "${{ secrets.WEBHOOK_SECRET }}" ] && missing+=("WEBHOOK_SECRET")
          [ -z "${{ secrets.STATS_KEY }}" ] && missing+=("STATS_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Отсутствуют секреты репозитория: ${missing[*]}"
            exit 1
          fi

      - name: Install wrangler
        run: npm install --no-save wrangler@4

      - name: Set worker secrets
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET
          printf '%s' "$STATS_KEY" | npx wrangler secret put STATS_KEY
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          STATS_KEY: ${{ secrets.STATS_KEY }}

      - name: Deploy worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          worker_url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$worker_url" ]; then
            echo "::error::Не удалось определить URL воркера из вывода wrangler deploy"
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Deployed at: $worker_url"

      - name: Register Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${WORKER_URL}/telegram-webhook\", \"secret_token\": \"${WEBHOOK_SECRET}\"}")
          cat response.json
          echo
          if [ "$http_code" != "200" ]; then
            echo "::error::setWebhook вернул HTTP $http_code"
            exit 1
          fi
